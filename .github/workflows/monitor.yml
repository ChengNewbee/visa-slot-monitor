name: Beijing B1-B2 slot monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: visa-slot-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Restore monitor state
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: visa-state-${{ github.run_id }}
          restore-keys: |
            visa-state-

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check public slot calendar
        env:
          VISA_CITY: 北京
          VISA_TYPE: B1/B2
          VISA_DESCRIPTION: All Others
          VISA_START: TODAY
          VISA_END: "2026-11-30"
          VISA_NTFY_TOPIC: ${{ secrets.VISA_NTFY_TOPIC }}
          VISA_EMAIL_TO: ${{ secrets.VISA_EMAIL_TO }}
          VISA_SMTP_HOST: smtp.qq.com
          VISA_SMTP_PORT: "465"
          VISA_SMTP_USER: ${{ secrets.VISA_SMTP_USER }}
          VISA_SMTP_PASSWORD: ${{ secrets.VISA_SMTP_PASSWORD }}
          VISA_STATE: .state/state.json
        run: python monitor.py --once

      - name: Save monitor state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: visa-state-${{ github.run_id }}
